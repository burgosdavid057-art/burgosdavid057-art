name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # color_snake LLEVA #. Sin él la accion escribe `--cs:22D3EE` en el CSS,
          # que es un color invalido, y la serpiente se queda sin pintar.
          # El primer color de color_dots es la celda vacia: en oscuro tiene que
          # ser un slate visible, porque contra el #0d1117 de GitHub un tono casi
          # negro desaparece y la cuadricula se ve rota.
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=%230891B2&color_dots=#EDEFF5,#C7CDF7,#94A0F0,#5468FF,#2F3BB0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2322D3EE&color_dots=#2A2F3D,#2F3BB0,#4453C9,#5468FF,#8A97FF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
